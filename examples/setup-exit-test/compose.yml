# Demonstrates allow_setup_exit=True:
#   setup           — writes /shared/ready + exits 0
#   longlived       — stays running (stand-in for an API / database)
#   test_container  — gates on both, asserts /shared/ready exists

services:
  setup:
    image: ubuntu:25.04
    restart: "no"
    volumes:
      - shared:/shared
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        touch /shared/ready
        echo "setup: wrote /shared/ready"

  longlived:
    image: ubuntu:25.04
    entrypoint: ["sleep", "infinity"]

  test_container:
    image: ubuntu:25.04
    restart: "no"
    volumes:
      - shared:/shared
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        test -f /shared/ready
        echo "test: /shared/ready exists — PASS"
    depends_on:
      setup:
        condition: service_completed_successfully
      longlived:
        condition: service_started

volumes:
  shared:
